<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YourTube · Subscriptions layout study</title>
<style>
:root{color-scheme:dark;--bg:#1c211e;--panel:#252b27;--line:#37423a;--ink:#edf1eb;--muted:#b1bdb3;--sage:#c5ddb6;--selected:#314337;font-family:'Segoe UI',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#121613;color:var(--ink)}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}button:focus-visible{outline:2px solid var(--sage);outline-offset:-2px}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.study{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;padding:12px 24px;border-bottom:1px solid #3e4a40;background:#151b17}.kicker{display:block;color:var(--sage);font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:750}.study strong{font-size:17px}.switches{display:flex;flex-wrap:wrap;gap:6px}.switches button{padding:8px 12px;border-radius:6px;color:var(--muted);font-size:13px;border:1px solid var(--line);white-space:nowrap}.switches button[aria-pressed=true]{background:var(--sage);color:#1a241b;border-color:transparent;font-weight:700}.switches b{font-size:11px;margin-right:5px}.note{color:var(--muted);padding:10px 24px;margin:0;font-size:12px;background:#171d19;border-bottom:1px solid #3e4a40}
.app{height:calc(100dvh - 107px);min-height:470px;background:var(--bg);display:grid;grid-template-columns:180px minmax(0,1fr);grid-template-rows:46px minmax(0,1fr);--rail:218px;--card:255px}.window{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:16px;font-weight:720}.brand{display:flex;align-items:center;gap:9px}.brand i{display:grid;place-items:center;color:#26352a;background:var(--sage);width:29px;height:29px;border-radius:7px}.brand svg{width:17px}.chrome{display:flex;gap:29px;color:var(--muted);font-size:14px;font-weight:400}.nav{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:16px 12px}.nav span{display:flex;align-items:center;gap:10px;padding:11px;border-radius:7px;font-size:14px;white-space:nowrap}.nav .active{color:var(--sage);background:var(--selected)}.nav .profile{margin-top:auto;padding-left:6px;font-size:12px}.profile i{display:grid;place-items:center;width:27px;height:27px;background:#3b4940;border-radius:50%;font-style:normal;font-size:10px}
main{display:grid;grid-template-rows:auto minmax(0,1fr);padding:20px 24px 14px;min-height:0}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}h1,h2,p{margin:0}h1{font-size:26px;letter-spacing:-.035em}.refresh{color:var(--muted);border-radius:6px;padding:7px}.refresh:hover{background:var(--panel)}.split{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:0}.channels{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);padding:20px 14px 0 0}.railhead{font-size:11px;font-weight:720;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 8px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px}.railcount{font-size:11px;letter-spacing:0;color:var(--muted)}.options{overflow:auto;min-height:0;padding-bottom:8px}.choice{display:flex;text-align:left;align-items:center;gap:10px;width:100%;border-radius:6px;padding:8px;min-height:43px;margin-bottom:3px;position:relative;white-space:nowrap}.choice .label{overflow:hidden;text-overflow:ellipsis;font-size:13px}.choice:hover{background:var(--panel)}.choice[aria-pressed=true]{background:var(--selected);color:var(--sage);font-weight:650}.choice[aria-pressed=true]::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--sage);border-radius:3px}.all{margin-bottom:8px}.avatar{display:grid;flex:none;place-items:center;border-radius:50%;width:26px;height:26px;font-size:8px;font-weight:800;letter-spacing:.01em;background:var(--avatar,#263b31);color:#f8faf8}.avatar svg{width:15px;height:15px}.all .avatar{color:var(--sage);background:#26362c}.gridpane{overflow:auto;min-height:0;padding:17px 2px 20px 20px;scrollbar-color:#536256 transparent}.feedhead{display:flex;align-items:baseline;gap:11px;margin-bottom:14px}.feedhead h2{font-size:19px;letter-spacing:-.025em}.results{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--card)),1fr));gap:16px 14px}.card{min-width:0}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--panel)}.card h3{margin:8px 2px 3px;font-size:14px;line-height:1.34;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card p{color:var(--muted);margin:0 2px;font-size:12px}.empty{margin-top:38px;text-align:center;border:1px dashed var(--line);border-radius:8px;padding:36px 10px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.feedback{font-size:12px;color:var(--sage);margin-left:auto}
.app[data-layout=panel]{--rail:252px;--card:266px}.app[data-layout=panel] .split{padding-top:16px}.app[data-layout=panel] .channels{padding:15px 10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}.app[data-layout=panel] .gridpane{padding-top:0}.app[data-layout=panel] .choice:not([aria-pressed=true]):hover{background:#343e36}.app[data-layout=panel] .choice{min-height:48px}.app[data-layout=panel] .avatar{width:30px;height:30px}
.app[data-layout=compact]{--rail:166px;--card:205px}.app[data-layout=compact] .channels{padding-right:8px}.app[data-layout=compact] .gridpane{padding-left:14px}.app[data-layout=compact] .choice{min-height:34px;padding:6px 7px;gap:8px}.app[data-layout=compact] .avatar{width:21px;height:21px;font-size:7px}.app[data-layout=compact] .railhead{letter-spacing:.055em;font-size:10px}.app[data-layout=compact] .grid{gap:13px 11px}.app[data-layout=compact] .card h3{font-size:13px}
@media(max-width:1080px){.app{grid-template-columns:142px minmax(0,1fr);--rail:186px;--card:205px}.app[data-layout=panel]{--rail:200px;--card:205px}.app[data-layout=compact]{--rail:156px;--card:175px}}@media(max-width:760px){.study{padding:10px 12px;flex-wrap:wrap;gap:8px}.note{padding:7px 12px}.app{grid-template-columns:48px minmax(0,1fr);height:calc(100dvh - 147px);--rail:132px}.app[data-layout=panel],.app[data-layout=compact]{--rail:132px}.nav{padding:8px 3px}.nav span{justify-content:center;padding:10px 0}.nav b{display:none}main{padding:10px 8px}.channels,.app[data-layout=compact] .channels{padding-right:4px}.railhead{font-size:9px;padding-inline:3px}.gridpane,.app[data-layout=compact] .gridpane{padding-left:8px}.choice{gap:4px;padding-inline:4px}.choice .label{font-size:11px}.avatar{width:21px;height:21px}.app[data-layout=panel] .channels{padding-inline:4px}.app[data-layout=panel] .avatar{width:21px;height:21px}.feedhead{gap:4px;flex-wrap:wrap}.feedhead h2{font-size:16px}}
.choice.all .label{white-space:normal;overflow:visible;line-height:1.2}.app[data-layout=compact] .choice.all .label{font-size:12px}@media(max-width:760px){.app[data-layout=compact] .choice.all .label{font-size:11px}}
</style></head><body>
<header class="study"><div><span class="kicker">YourTube · Windows design study</span><strong>Subscriptions layout options</strong></div><div class="switches" role="group" aria-label="Mockup layout"><button data-layout="inline" aria-pressed="true"><b>A</b> Inline rail</button><button data-layout="panel" aria-pressed="false"><b>B</b> Channel panel</button><button data-layout="compact" aria-pressed="false"><b>C</b> Compact rail</button></div></header>
<p class="note" id="note"></p>
<div class="app" data-layout="inline"><header class="window"><span class="brand"><i data-icon="play"></i>YourTube</span><span class="chrome" aria-hidden="true">− <span>□</span> ×</span></header>
<aside class="nav" aria-label="App navigation (illustrative)"><span><i data-icon="home"></i><b>Home</b></span><span class="active"><i data-icon="video"></i><b>Subscriptions</b></span><span><i data-icon="history"></i><b>History</b></span><span><i data-icon="settings"></i><b>Settings</b></span><span class="profile"><i>YT</i><b>Demo account</b></span></aside>
<main><header class="pagehead"><h1>Subscriptions</h1><span class="feedback" role="status"></span><button class="refresh" aria-label="Reset sample feed scroll" title="Reset sample feed scroll" data-icon="refresh"></button></header>
<div class="split"><aside class="channels" aria-labelledby="channels-heading"><h2 class="railhead" id="channels-heading">Subscribed Channels <span class="railcount">3</span></h2><button class="choice all" data-channel="all" aria-pressed="true"><span class="avatar" data-icon="stack"></span><span class="label">All Subscriptions</span></button><div class="options" id="options"></div></aside>
<section class="gridpane" aria-labelledby="feed-title" tabindex="0"><header class="feedhead"><h2 id="feed-title">All Subscriptions</h2><span class="results" role="status"></span></header><div class="grid"></div></section></div></main></div>
<script>
const icons={play:'<path d="m8 5 12 7-12 7z"/>',home:'<path d="m3 11 9-8 9 8v9h-6v-6H9v6H3z"/>',video:'<rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-3v10l-6-3"/>',history:'<path d="M3 12a9 9 0 1 1 2 6m-2-1v-5h5m4-5v5l3 2"/>',settings:'<path d="m10 3-1 3-3 1-3 3 2 2v2l-1 2 3 3 3-1 2 3 3-1 1-3 3-1 2-3-2-2v-2l1-2-3-3-3 1-2-2z"/><circle cx="12" cy="12" r="3"/>',refresh:'<path d="M20 10a8 8 0 1 0 0 5m0-11v6h-6"/>',stack:'<rect x="4" y="6" width="16" height="12" rx="2"/><path d="m10 10 4 2-4 2zM7 3h10M7 21h10"/>'};
const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[k]}</svg>`;document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));
const channels=[['nba','NBA','NBA','#254574'],['cbc','CBC News','CBC','#943436'],['nbc','NBC Sports','NBC','#345b51']];
const videos=[['nba','THUNDER at PACERS | FULL GAME HIGHLIGHTS | November 23, 2026'],['nba','NETS at TIMBERWOLVES | FULL GAME HIGHLIGHTS | November 23, 2026'],['nba','GRIZZLIES at HORNETS | FULL GAME HIGHLIGHTS | November 23, 2026'],['nba','TRAIL BLAZERS at 76ERS | FULL GAME HIGHLIGHTS | November 23, 2026'],['cbc','Manitoba dentist pleads guilty to misconduct leading to patient’s death | Hanomansing Live'],['cbc','How London police cracked a 1968 cold case | Hanomansing Live'],['nbc','Steve Kornacki breaks down the 2026 National Dog Show | Fanta in 60'],['cbc','Poilievre not on the ballot in upcoming byelections | Power & Politics']];
const images=/* ARTWORK */[];
const layouts={inline:'Recommended · A divider separates the list from the grid while keeping both in the same workspace.',panel:'A bordered channel panel and taller rows make channel switching more prominent.',compact:'A narrower list and smaller cards leave room for more videos per row.'};
const q=s=>document.querySelector(s);let selected='all';
q('#options').innerHTML=channels.map(([id,name,abbr,color])=>`<button class="choice" data-channel="${id}" aria-pressed="false" title="${name}"><span class="avatar" style="--avatar:${color}" aria-hidden="true">${abbr}</span><span class="label">${name}</span></button>`).join('');
function render(){
  const shown=videos.map(([id,title],i)=>({id,title,i})).filter(v=>selected==='all'||v.id===selected);
  document.querySelectorAll('[data-channel]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.channel===selected)));
  q('#feed-title').textContent=selected==='all'?'All Subscriptions':channels.find(c=>c[0]===selected)[1];
  q('.results').textContent=`${shown.length} sample ${shown.length===1?'video':'videos'}`;
  q('.grid').innerHTML=shown.map(({id,title,i})=>`<article class="card" data-video-channel="${id}"><img src="${images[i]}" alt=""><h3>${title}</h3><p>${channels.find(c=>c[0]===id)[1]}</p></article>`).join('');
  q('.gridpane').scrollTop=0;q('.feedback').textContent='';
}
function layout(id){q('.app').dataset.layout=id;q('#note').textContent=layouts[id]+' Sample content from the reference screenshot.';document.querySelectorAll('.switches button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===id)));}
document.querySelectorAll('[data-channel]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.channel;render()}));
document.querySelectorAll('.switches button').forEach(b=>b.addEventListener('click',()=>layout(b.dataset.layout)));
q('.refresh').addEventListener('click',()=>{render();q('.feedback').textContent='Sample feed reset'});
layout('inline');render();
</script></body></html>
