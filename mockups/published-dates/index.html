<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YourTube · Published dates</title>
<style>
:root{color-scheme:dark;--bg:#1c211e;--ink:#edf1eb;--muted:#b7c2b9;--sage:#c4dcb6;--line:#38443b;font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body,h1,h2,h3,p{margin:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,time:focus-visible{outline:2px solid var(--sage);outline-offset:3px}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
.study{padding:16px clamp(16px,2.3vw,40px) 14px;background:#141a16;border-bottom:1px solid var(--line)}.study-top{display:flex;align-items:center;justify-content:space-between;gap:14px 30px;flex-wrap:wrap}.study small{display:block;color:var(--sage);text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:750;margin-bottom:4px}.study strong{font-size:19px;letter-spacing:-.02em}.options{display:flex;flex-wrap:wrap;gap:8px}.options button{display:flex;align-items:center;gap:7px;padding:7px 11px;background:transparent;border:1px solid var(--line);border-radius:7px;font-size:13px}.options button span{font-size:11px;opacity:.8}.options button:hover{border-color:var(--sage)}.options button[aria-pressed=true]{color:#19241b;background:var(--sage);border-color:var(--sage);font-weight:650}.study-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 20px;margin-top:10px;font-size:12px;color:var(--muted)}.sample{color:var(--sage)}
.window{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:750}.logo{display:grid;place-items:center;width:34px;height:33px;border-radius:8px;background:var(--sage);color:#273529}.logo svg{width:17px}.chrome{white-space:pre;color:var(--muted);font-size:16px}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100vh - 150px)}.nav{padding:20px 14px;border-right:1px solid var(--line)}.nav div{display:flex;gap:10px;align-items:center;padding:12px;margin-bottom:4px;border-radius:8px;font-size:16px}.nav .active{background:#314034;color:var(--sage)}main{min-width:0;padding:25px 32px 40px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}h1{font-size:28px;letter-spacing:-.035em}h2{font-size:21px;letter-spacing:-.025em;margin:0 0 12px}section+section{margin-top:42px}
.shelf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px;max-width:1485px}.card{min-width:0}.art{position:relative;aspect-ratio:285/161}.art img{display:block;width:100%;height:100%;object-fit:cover;border-radius:8px}.copy{padding:8px 4px 0}.copy h3{font-size:clamp(14px,1vw,18px);line-height:1.32;letter-spacing:-.015em;font-weight:650;min-height:2.64em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;align-items:baseline;gap:6px;min-width:0;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.45}.channel{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.when{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.when[hidden]{display:none}.when svg{width:14px;height:14px}.sep{opacity:.8}.exact,.badge{display:none}.relative{cursor:help}.short .meta{margin-top:4px}
[data-layout=exact] .meta{flex-wrap:wrap;gap:1px 0}[data-layout=exact] .when:not([hidden]){width:100%}[data-layout=exact] .relative,[data-layout=exact] .sep,[data-layout=badge] .when,[data-layout=badge] .sep{display:none}[data-layout=exact] .exact{display:inline-flex;align-items:center;gap:5px}[data-layout=exact] .exact svg{color:var(--sage)}[data-layout=badge] .badge{display:block;position:absolute;top:8px;left:8px;max-width:calc(100% - 16px);padding:4px 7px;border-radius:5px;background:#101611ef;color:#f1f5ef;font-size:clamp(10px,.9vw,13px);font-weight:600;white-space:nowrap;cursor:help}[data-layout=badge] .short .meta{display:none}
@media(max-width:1200px){.app{grid-template-columns:164px minmax(0,1fr)}main{padding-inline:24px}.shelf{grid-template-columns:none;grid-template-rows:auto;grid-auto-flow:column;grid-auto-columns:clamp(188px,22vw,260px);overflow-x:auto;padding:1px 0 8px;scrollbar-color:#576559 transparent}}
@media(max-width:650px){.app{grid-template-columns:48px minmax(0,1fr)}.nav{padding:12px 4px}.nav div{justify-content:center;padding:9px 0}.nav span,.chrome{display:none}main{padding:16px 12px}.window{padding-inline:13px}.study{padding-inline:13px}section+section{margin-top:25px}.shelf{grid-auto-columns:164px;gap:10px}}
</style>
<header class="study"><div class="study-top"><div><small>YourTube · Windows design study</small><strong>Published dates on thumbnail cards</strong></div><div class="options" role="group" aria-label="Publication date layout"><button data-option="inline" aria-pressed="true"><span>A</span> Inline age</button><button data-option="exact" aria-pressed="false"><span>B</span> Exact date</button><button data-option="badge" aria-pressed="false"><span>C</span> Thumbnail badge</button></div></div><div class="study-bottom"><p id="description" aria-live="polite"></p><p class="sample">Sample dates only · not actual upload dates</p></div></header>
<div id="preview" data-layout="inline">
<div class="window"><div class="brand"><span class="logo" data-icon="play"></span>YourTube</div><span class="chrome" aria-hidden="true">−        □        ×</span></div>
<div class="app"><aside class="nav" aria-label="Illustrative app navigation"><div class="active" aria-label="Home"><i data-icon="home"></i><span>Home</span></div><div aria-label="Subscriptions"><i data-icon="video"></i><span>Subscriptions</span></div><div aria-label="History"><i data-icon="history"></i><span>History</span></div><div aria-label="Settings"><i data-icon="settings"></i><span>Settings</span></div></aside>
<main><div class="head"><h1>Home</h1><i data-icon="refresh"></i></div><section aria-labelledby="recommended"><h2 id="recommended">Recommended</h2><div class="shelf" id="videos"></div></section><section aria-labelledby="short-title"><h2 id="short-title">Shorts</h2><div class="shelf" id="shorts"></div></section></main></div></div>
<script>
const paths={play:'<path d="m5 4 15 8-15 8z"/>',home:'<path d="m3 11 9-8 9 8v9h-6v-6H9v6H3z"/>',video:'<rect x="3" y="5" width="14" height="14" rx="2"/><path d="m17 10 4-3v10l-4-3"/>',history:'<path d="M3 7v5h5m-5 0a9 9 0 1 1 2 6m7-11v5l3 2"/>',settings:'<path d="m10 3-1 3-3 1-3 3 2 2v2l-1 2 3 3 3-1 2 3 3-1 1-3 3-1 2-3-2-2-1-3-3-1-1-3z"/><circle cx="12" cy="12" r="3"/>',refresh:'<path d="M21 11a9 9 0 1 1-3-6l3 3m0-5v5h-5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const videos=[['Why Anthropic Is Walking Into the Stock Market Now','Casual Finance','2026-11-22','2 days ago'],['Vagrant Story REIMAGINEDv4 HDRcade PC Port | VS Unofficial Remaster','HDRcade','2026-11-17','1 week ago'],['Hermes: The AI Agent That Learns Your Workflow','Christian Lempa','2026-11-08','2 weeks ago'],['Tesla FSD V15 Takes On a PARKING GARAGE','Indian Tesla','2026-11-23','1 day ago'],['This Chun Li Artwork is ACTUALLY 3D','Vertex Arcade and 2 more','2026-10-24','1 month ago']];
const shorts=[['The Genius Engineering Behind a Triangle-Wheel Bicycle','','2026-11-23','1 day ago'],["Rivian’s upcoming point to point system vs Tesla’s Full Self-Driving",'','2026-11-21','3 days ago'],['Why a straight chimney fills your living room with smoke','','2026-11-20','4 days ago'],['I make shooting simple, follow me :) #basketball','','2026-11-17','1 week ago'],["Is this really a AULA’s keyboard? #keyboard",'','2026-11-10','2 weeks ago']];
const format=new Intl.DateTimeFormat('en-US',{dateStyle:'medium',timeZone:'UTC'});
function card([title,channel,iso,age],i,short){
const stamp=format.format(new Date(iso));
const ageTag=cls=>`<time class="${cls}" datetime="${iso}" title="Published ${stamp}" aria-label="Published ${stamp}, ${age}">${age}</time>`;
return `<article class="card${short?' short':''}"><div class="art"><img alt="" src="art-${i}.jpg">${ageTag('badge')}</div><div class="copy"><h3>${title}</h3><p class="meta">${channel?`<span class="channel">${channel}</span><span class="sep" aria-hidden="true">·</span>`:''}<span class="when">${ageTag('relative')}<span class="exact">${icon('calendar')}<time datetime="${iso}" aria-label="Published ${stamp}">${stamp}</time></span></span></p></div></article>`;
}
document.getElementById('videos').innerHTML=videos.map((v,i)=>card(v,i,false)).join('');
document.getElementById('shorts').innerHTML=shorts.map((v,i)=>card(v,i+5,true)).join('');
const descriptions={inline:'Recommended · Show “2 days ago” next to the channel name. Hover over it for the exact date.',exact:'Give the calendar date its own line so you can read it without hovering.',badge:'Show the age in the upper-left corner of the artwork, away from the runtime.'};
const options=document.querySelectorAll('[data-option]');
function select(layout){document.getElementById('preview').dataset.layout=layout;options.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===layout)));document.getElementById('description').textContent=descriptions[layout];}
options.forEach(b=>b.addEventListener('click',()=>select(b.dataset.option)));select('inline');
</script>
</html>
